# ==============================================================================
# NGINX Ingress Controller Configuration for Hetzner Cloud
# ==============================================================================
# Optimized configuration for running NGINX Ingress Controller on Hetzner
# Cloud Kubernetes with Hetzner Load Balancer integration
# ==============================================================================

controller:
  replicaCount: 3

  admissionWebhooks:
    patch:
      affinity: {}

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: ingress-nginx
            app.kubernetes.io/component: controller
        topologyKey: "kubernetes.io/hostname"

  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      load-balancer.hetzner.cloud/uses-proxyprotocol: "true"
      load-balancer.hetzner.cloud/type: "lb11"

  config:
    use-proxy-protocol: "true"