apiVersion: v1
kind: Service
metadata:
  name: dozerdb-service
  namespace: dozerdb-ns
spec:
  type: LoadBalancer
  selector:
    app: dozerdb
  ports:
    - port: 443
      targetPort: 7474
      protocol: TCP
      name: https
    - port: 7687
      targetPort: 7687
      protocol: TCP
      name: bolt