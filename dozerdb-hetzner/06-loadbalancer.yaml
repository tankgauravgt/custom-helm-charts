# ==============================================================================
# DozerDB Load Balancer Service
# ==============================================================================
# Single LoadBalancer that handles all traffic:
#   - HTTP (port 80) → http-redirect sidecar → redirects to HTTPS
#   - HTTPS (port 443) → DozerDB on port 7474
#   - Bolt (port 7687) → DozerDB bolt protocol
#
# This uses only ONE LoadBalancer to save costs!
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: dozerdb-service
  namespace: dozerdb-ns
spec:
  type: LoadBalancer
  
  # Select pods with the 'dozerdb' label (will include sidecar)
  selector:
    app: dozerdb
  
  # Port mappings
  ports:
    # HTTP redirect
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
    
    # HTTPS access for Neo4j Browser and HTTP API
    - port: 443
      targetPort: 7474
      protocol: TCP
      name: https
    
    # Bolt protocol for database connections
    - port: 7687
      targetPort: 7687
      protocol: TCP
      name: bolt