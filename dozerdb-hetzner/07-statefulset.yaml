# ==============================================================================
# DozerDB StatefulSet
# ==============================================================================
# Deploys DozerDB (Neo4j-based graph database) with:
#   - SSL/TLS encryption for HTTPS and Bolt connections
#   - Persistent storage using Hetzner Cloud Volumes
#   - APOC plugin enabled
# ==============================================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dozerdb
  namespace: dozerdb-ns
spec:
  serviceName: "dozerdb-headless"
  replicas: 1
  
  selector:
    matchLabels:
      app: dozerdb
  
  template:
    metadata:
      labels:
        app: dozerdb
    
    spec:
      terminationGracePeriodSeconds: 30
      
      # Schedule on Hetzner nodes
      nodeSelector:
        cfke.io/provider: hetzner
      
      containers:
        # HTTP to HTTPS redirect sidecar
        - name: http-redirect
          image: nginx:alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: nginx-redirect-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
        
        # Main DozerDB container
        - name: dozerdb
          image: graphstack/dozerdb:5.26.3.0
          
          # Exposed ports
          ports:
            - containerPort: 7474
              name: https
            - containerPort: 7687
              name: bolt
          
          # Resource limits and requests (bare minimum)
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "2Gi"
              cpu: "2"
          
          # Environment variables for Neo4j configuration
          env:
            # =================================================================
            # Authentication
            # =================================================================
            - name: NEO4J_AUTH
              value: "neo4j/temppassword"
            
            # =================================================================
            # Plugin Configuration
            # =================================================================
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_apoc_export_file_enabled
              value: "true"
            - name: NEO4J_apoc_import_file_enabled
              value: "true"
            - name: NEO4J_dbms_security_procedures_unrestricted
              value: "*"
                          
            # =================================================================
            # HTTP/HTTPS Configuration
            # =================================================================
            # Disable plain HTTP (all traffic will use HTTPS)
            - name: NEO4J_server_http_enabled
              value: "false"
            
            # Enable HTTPS connector
            - name: NEO4J_server_https_enabled
              value: "true"
            - name: NEO4J_server_https_listen__address
              value: ":7474"
            
            # =================================================================
            # SSL Policy for HTTPS
            # =================================================================
            - name: NEO4J_dbms_ssl_policy_https_enabled
              value: "true"
            - name: NEO4J_dbms_ssl_policy_https_base__directory
              value: "/tls"
            - name: NEO4J_dbms_ssl_policy_https_public__certificate
              value: "tls.crt"
            - name: NEO4J_dbms_ssl_policy_https_private__key
              value: "tls.key"
            
            # =================================================================
            # SSL Policy for Bolt Protocol
            # =================================================================
            - name: NEO4J_server_bolt_tls__level
              value: "REQUIRED"
            - name: NEO4J_dbms_ssl_policy_bolt_enabled
              value: "true"
            - name: NEO4J_dbms_ssl_policy_bolt_base__directory
              value: "/tls"
            - name: NEO4J_dbms_ssl_policy_bolt_public__certificate
              value: "tls.crt"
            - name: NEO4J_dbms_ssl_policy_bolt_private__key
              value: "tls.key"
          
          # Volume mounts
          volumeMounts:
            # Persistent data storage
            - name: data
              mountPath: /data
            
            # TLS certificates
            - name: tls-secret
              mountPath: /tls
              readOnly: false
      
      # Volumes
      volumes:
        - name: tls-secret
          secret:
            secretName: dozerdb-tls
        
        # Nginx redirect configuration
        - name: nginx-redirect-config
          configMap:
            name: nginx-redirect-config
  
  # Persistent Volume Claims (bare minimum)
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: hcloud-volumes
        resources:
          requests:
            storage: 10Gi