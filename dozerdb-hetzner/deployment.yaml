apiVersion: v1
kind: Namespace
metadata:
  name: dozerdb-ns
  labels:
    name: dozerdb-ns
    app: dozerdb

---
# Resource 1: Headless Service
apiVersion: v1
kind: Service
metadata:
  name: dozerdb-headless
  namespace: dozerdb-ns
spec:
  clusterIP: None
  selector:
    app: dozerdb
  ports:
    - port: 7474
      name: http
    - port: 7687
      name: bolt

---
# Resource 2: LoadBalancer Service (Public access)
apiVersion: v1
kind: Service
metadata:
  name: dozerdb-service
  namespace: dozerdb-ns
spec:
  type: LoadBalancer
  selector:
    app: dozerdb
  ports:
    - port: 7474
      targetPort: 7474
      protocol: TCP
      name: http
    - port: 7687
      targetPort: 7687
      protocol: TCP
      name: bolt

---
# Resource 3: StatefulSet (Hetzner CSI integrated)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dozerdb
  namespace: dozerdb-ns
spec:
  serviceName: "dozerdb-headless"
  replicas: 1
  selector:
    matchLabels:
      app: dozerdb
  template:
    metadata:
      labels:
        app: dozerdb
    spec:
      terminationGracePeriodSeconds: 30
      nodeSelector:
        cfke.io/provider: hetzner  # ensures pod schedules on Hetzner node
      containers:
        - name: dozerdb
          image: graphstack/dozerdb:5.26.3.0
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "4"
          env:
            - name: NEO4J_AUTH
              value: "neo4j/temppassword"
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_apoc_export_file_enabled
              value: "true"
            - name: NEO4J_apoc_import_file_enabled
              value: "true"
            - name: NEO4J_dbms_security_procedures_unrestricted
              value: "*"
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: hcloud-volumes
        resources:
          requests:
            storage: 100Gi
